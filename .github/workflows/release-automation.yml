name: Release & Asset Packaging Automation

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Build Production Release Artifacts & GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Build Application
        run: npm run build:gh

      - name: 📦 Package Dist Bundle into Zip
        run: |
          cd dist/gidiyorum/browser
          zip -r ../../../gidiyorum-release-${{ github.ref_name }}.zip .

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gidiyorum-release-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
